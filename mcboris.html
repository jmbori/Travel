<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>McBoris World Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEEE1;
    --ink:#2B2A24;
    --ink-soft:#5C5A4E;
    --wine:#6B4657;
    --olive:#7C8459;
    --gold:#C99A3B;
    --line:#D6D5C4;
    --card:#F6F6EE;
    --danger:#A5453B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Work Sans', sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.serif{font-family:'Fraunces', serif;}
  .wrap{max-width:980px;margin:0 auto;padding:28px 20px 80px;}
  header.top{margin-bottom:24px;}
  header.top h1{font-size:32px;font-weight:600;margin:0 0 4px;letter-spacing:-0.01em;}
  header.top p{margin:0;color:var(--ink-soft);font-size:15px;text-transform:capitalize;}

  nav.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:26px;overflow-x:auto;}
  nav.tabs button{background:none;border:none;padding:10px 4px;margin-right:16px;font-family:'Work Sans',sans-serif;font-size:15px;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--wine);font-weight:600;}

  section.panel{display:none;}
  section.panel.active{display:block;}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-head h2{font-size:22px;margin:0;font-weight:600;text-transform:capitalize;}
  .cal-nav{display:flex;gap:8px;align-items:center;}
  .cal-nav button{background:#fff;border:1px solid var(--line);border-radius:4px;width:30px;height:30px;cursor:pointer;font-size:15px;color:var(--ink);}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);}
  .cal-dow{font-size:11px;color:var(--ink-soft);text-align:left;padding:4px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card);}
  .cal-cell{min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px;position:relative;background:#fff;cursor:pointer;}
  .cal-cell:hover{background:var(--card);}
  .cal-cell.selected{outline:2px solid var(--wine);outline-offset:-2px;}
  .cal-cell.faded{background:var(--paper);opacity:0.45;}
  .cal-daynum{font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .cal-cell.today .cal-daynum{color:#fff;background:var(--wine);width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;}
  .cal-chip{font-size:10.5px;padding:2px 5px;border-radius:3px;color:#fff;margin-bottom:2px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-chip.pending{background:repeating-linear-gradient(45deg,var(--gold),var(--gold) 4px,#dbb659 4px,#dbb659 8px);color:#3A2E0F;}
  .cal-flight{font-size:10px;color:var(--wine);margin-bottom:2px;}
  .cal-transport{font-size:10px;color:var(--olive);margin-bottom:2px;}

  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:12px;color:var(--ink-soft);}
  .legend span.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle;}

  .day-view{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-top:18px;}
  .day-view-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .day-view-head h3{margin:0;font-size:18px;text-transform:capitalize;}
  .day-item{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);}
  .day-item:last-of-type{border-bottom:none;}
  .day-time{font-size:13px;font-weight:600;color:var(--wine);min-width:64px;flex-shrink:0;}
  .day-label{margin:0;font-size:14px;}
  .day-sub{margin:2px 0 0;font-size:12px;color:var(--ink-soft);}
  .day-untimed-label{font-size:12px;color:var(--ink-soft);margin:10px 0 4px;font-style:italic;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:14px;}
  .card h3{margin:0 0 10px;font-size:18px;}
  .flight-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .flight-row .from-to{font-size:16px;font-weight:600;}
  .flight-row .when{font-size:14px;color:var(--ink-soft);}
  .tag{font-size:11px;text-transform:none;background:var(--olive);color:#fff;padding:2px 8px;border-radius:20px;}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--gold);color:#3A2E0F;margin-left:6px;}
  .stop-actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:600px){.grid2{grid-template-columns:1fr;}.cal-cell{min-height:70px;}}

  .field-map{display:flex;gap:6px;align-items:flex-end;}
  .field-map .field{flex:1;margin-bottom:0;}
  .map-btn{padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;font-size:15px;height:37px;}
  .map-btn:hover{border-color:var(--wine);}

  input,select,textarea{font-family:'Work Sans',sans-serif;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);width:100%;}
  label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:3px;}
  .field{margin-bottom:10px;}
  .checkbox-field{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .checkbox-field input{width:auto;}
  button.action{font-family:'Work Sans',sans-serif;background:var(--wine);color:#fff;border:none;padding:9px 16px;border-radius:4px;font-size:14px;cursor:pointer;}
  button.action:hover{opacity:0.9;}
  button.ghost{background:none;border:1px solid var(--line);color:var(--ink-soft);padding:6px 10px;border-radius:4px;font-size:12px;cursor:pointer;}
  button.ghost:hover{border-color:var(--danger);color:var(--danger);}

  .idea-list{list-style:none;padding:0;margin:0;}
  .idea-list li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:14px;flex-wrap:wrap;}
  .idea-list li:last-child{border-bottom:none;}
  .city-badge{font-size:11px;color:var(--wine);font-weight:600;}

  .empty{color:var(--ink-soft);font-size:14px;font-style:italic;}
  .save-note{font-size:12px;color:var(--ink-soft);margin-top:24px;text-align:center;}
  .add-form{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🌎✈️ McBoris World Tour</h1>
    <p id="header-subtitle"></p>
  </header>

  <nav class="tabs">
    <button data-tab="resumen" class="active">Route</button>
    <button data-tab="vuelos">Flights</button>
    <button data-tab="transporte">Transport</button>
    <button data-tab="stay">Stay</button>
    <button data-tab="ideas">Plans</button>
  </nav>

  <section class="panel active" id="panel-resumen">
    <div class="cal-head">
      <h2 id="cal-month-label"></h2>
      <div class="cal-nav">
        <button onclick="shiftMonth(-1)">‹</button>
        <button onclick="shiftMonth(1)">›</button>
      </div>
    </div>
    <div class="cal-grid" id="cal-dow-row"></div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="legend" id="cal-legend"></div>
    <div id="day-view" class="day-view" style="display:none;"></div>
    <div style="margin-top:18px;">
      <button class="action" onclick="exportICS()">📅 Export to Apple Calendar (.ics)</button>
    </div>
  </section>

  <section class="panel" id="panel-vuelos">
    <div id="flight-list"></div>
    <div class="add-form">
      <h3>✈️ Add flight</h3>
      <div class="grid2">
        <div class="field-map"><div class="field"><label>Origin</label><input id="new-flight-from" placeholder="Bajío Airport"></div><button type="button" class="map-btn" onclick="mapSearch('new-flight-from')">🔍</button></div>
        <div class="field-map"><div class="field"><label>Destination</label><input id="new-flight-to" placeholder="Tijuana"></div><button type="button" class="map-btn" onclick="mapSearch('new-flight-to')">🔍</button></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Date</label><input id="new-flight-date" type="date"></div>
        <div class="field"><label>Airline (optional)</label><input id="new-flight-airline" placeholder="Ex. Volaris"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Departure time</label><input id="new-flight-depart" placeholder="6:50 am"></div>
        <div class="field"><label>Arrival time</label><input id="new-flight-arrive" placeholder="7:54 am"></div>
      </div>
      <button class="action" onclick="addFlight()">Add flight</button>
    </div>
  </section>

  <section class="panel" id="panel-transporte">
    <div id="transport-list"></div>
    <div class="add-form">
      <h3>🚗 Add transport</h3>
      <div class="grid2">
        <div class="field-map"><div class="field"><label>Origin</label><input id="new-transport-from" placeholder="Ex. Tijuana"></div><button type="button" class="map-btn" onclick="mapSearch('new-transport-from')">🔍</button></div>
        <div class="field-map"><div class="field"><label>Destination</label><input id="new-transport-to" placeholder="Ex. Ensenada"></div><button type="button" class="map-btn" onclick="mapSearch('new-transport-to')">🔍</button></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Type</label>
          <select id="new-transport-mode">
            <option value="auto">Car 🚗</option>
            <option value="autobus">Bus 🚌</option>
            <option value="barco">Boat ⛴️</option>
            <option value="tren">Train 🚆</option>
            <option value="taxi">Taxi 🚕</option>
            <option value="apie">Walking 🚶</option>
          </select>
        </div>
        <div class="field"><label>Estimated duration</label><input id="new-transport-duration" placeholder="Ex. 1 hr 30 min"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Departure time</label><input id="new-transport-depart" placeholder="Ex. 9:00 am"></div>
        <div class="field"><label>Arrival time</label><input id="new-transport-arrive" placeholder="Ex. 10:30 am"></div>
      </div>
      <div class="field"><label>Note (optional)</label><input id="new-transport-desc" placeholder="Ex. Pick up car at the airport"></div>
      <div class="field"><label>Date (optional, to show it on the calendar)</label><input id="new-transport-date" type="date"></div>
      <button class="action" onclick="addTransport()">Add</button>
    </div>
  </section>

  <section class="panel" id="panel-stay">
    <div id="stay-list"></div>
    <div class="add-form">
      <h3>🛏️ Add stay</h3>
      <div class="grid2">
        <div class="field"><label>Place</label><input id="new-stay-place" placeholder="Ex. Hotel Coral & Marina"></div>
        <div class="field-map"><div class="field"><label>City</label><input id="new-stay-city" placeholder="Ex. Ensenada"></div><button type="button" class="map-btn" onclick="mapSearch('new-stay-city')">🔍</button></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Check-in date</label><input id="new-stay-checkin-date" type="date"></div>
        <div class="field"><label>Check-in time</label><input id="new-stay-checkin-time" placeholder="Ex. 3:00 pm"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Check-out date</label><input id="new-stay-checkout-date" type="date"></div>
        <div class="field"><label>Check-out time</label><input id="new-stay-checkout-time" placeholder="Ex. 11:00 am"></div>
      </div>
      <div class="checkbox-field"><input type="checkbox" id="new-stay-pending"><label style="margin:0;">Still TBD</label></div>
      <button class="action" onclick="addStay()">Add stay</button>
    </div>
  </section>

  <section class="panel" id="panel-ideas">
    <div id="idea-list"></div>
    <div class="add-form">
      <h3>📍 Add plan</h3>
      <div class="grid2">
        <div class="field"><label>City</label><input id="new-idea-city" list="city-suggestions" placeholder="Ex. Ensenada"><datalist id="city-suggestions"></datalist></div>
        <div class="field"><label>Time</label><input id="new-idea-time" placeholder="Ex. 9:00 am"></div>
      </div>
      <div class="field"><label>Idea or plan</label><input id="new-idea-text" placeholder="Ex. Lechuza vineyard tour"></div>
      <button class="action" onclick="addIdea()">Add plan</button>
    </div>
  </section>

  <p class="save-note">Changes are saved automatically to your account.</p>
</div>

<script>
const STORAGE_KEY = 'baja-trip-data';
let data = null;
let calMonth = null;
let editingIds = new Set();
let currentDayIso = null;
let uid = () => Math.random().toString(36).slice(2, 10);

function toggleEdit(id) {
  if (editingIds.has(id)) editingIds.delete(id); else editingIds.add(id);
  renderAll();
}

const defaultData = {
  stays: [
    {id: uid(), place: '', city: 'Ensenada', checkinDate: '2026-11-07', checkinTime: '', checkoutDate: '2026-11-08', checkoutTime: '', pending: false},
    {id: uid(), place: '', city: 'Valle de Guadalupe', checkinDate: '2026-11-08', checkinTime: '', checkoutDate: '2026-11-11', checkoutTime: '', pending: false},
    {id: uid(), place: '', city: 'Tijuana', checkinDate: '2026-11-11', checkinTime: '', checkoutDate: '2026-11-12', checkoutTime: '', pending: false},
    {id: uid(), place: '', city: 'Mexicali', checkinDate: '2026-11-12', checkinTime: '', checkoutDate: '2026-11-14', checkoutTime: '', pending: false},
    {id: uid(), place: '', city: 'TBD', checkinDate: '2026-11-14', checkinTime: '', checkoutDate: '2026-11-16', checkoutTime: '', pending: true}
  ],
  cityColors: {},
  flights: [
    {id: uid(), from: 'Bajío Airport, León, MX', to: 'Tijuana, MX', dateISO: '2026-11-07', airline: '', depart: '6:50 am', arrive: '7:54 am', type: 'Outbound'},
    {id: uid(), from: 'Tijuana, MX', to: 'Bajío Airport, León, MX', dateISO: '2026-11-16', airline: '', depart: '12:45 am', arrive: '5:36 am', type: 'Return'}
  ],
  transports: [
    {id: uid(), from: 'Tijuana Airport', to: '', desc: 'Rental car, to get around Baja California', duration: '', depart: '', arrive: '', dateISO: '2026-11-07', mode: 'auto'}
  ],
  ideas: [
    {id: uid(), city: 'Valle de Guadalupe', time: '', text: 'Vineyard tour'},
    {id: uid(), city: 'Tijuana', time: '', text: 'Explore the city'},
    {id: uid(), city: 'Ensenada', time: '', text: 'Explore the city'},
    {id: uid(), city: 'Mexicali', time: '', text: 'Explore the city'}
  ]
};

function isoAdd(iso, days) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d + days);
  return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
}

async function loadData() {
  try {
    const res = await window.storage.get(STORAGE_KEY, false);
    data = JSON.parse(res.value);
    let migrated = false;

    // Migrate legacy nights-based cities into dated stays
    if (!data.stays && data.cities) {
      let cursor = data.tripStart || '2026-11-07';
      data.stays = data.cities.map(c => {
        const checkinDate = cursor;
        const checkoutDate = isoAdd(cursor, c.nights || 1);
        cursor = checkoutDate;
        return {id: c.id, place: '', city: c.name, checkinDate, checkinTime: '', checkoutDate, checkoutTime: '', pending: !!c.pending, notes: c.notes || ''};
      });
      delete data.cities;
      delete data.tripStart;
      migrated = true;
    }
    if (!data.stays) data.stays = [];
    if (!data.cityColors) data.cityColors = {};

    (data.transports || []).forEach(t => {
      if (!t.mode) { t.mode = 'auto'; migrated = true; }
      if (t.depart === undefined) { t.depart = ''; migrated = true; }
      if (t.arrive === undefined) { t.arrive = ''; migrated = true; }
    });
    (data.ideas || []).forEach(i => { if (i.time === undefined) { i.time = ''; migrated = true; } });
    (data.flights || []).forEach(f => {
      const isBajioTijuanaOutbound = f.from && f.from.includes('Baj') && f.to && f.to.includes('Tijuana');
      const isTijuanaBajioReturn = f.from && f.from.includes('Tijuana') && f.to && f.to.includes('Baj');
      if (isBajioTijuanaOutbound && f.dateISO !== '2026-11-07') { f.dateISO = '2026-11-07'; migrated = true; }
      if (isTijuanaBajioReturn && f.dateISO !== '2026-11-16') { f.dateISO = '2026-11-16'; migrated = true; }
    });
    if (migrated) await saveData();
  } catch (e) {
    data = defaultData;
    await saveData();
  }
  calMonth = initialMonth();
  renderAll();
}

async function saveData() {
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(data), false); }
  catch (e) { console.error('Could not save', e); }
}

function initialMonth() {
  let dates = [];
  (data.stays || []).forEach(s => { if (s.checkinDate) dates.push(s.checkinDate); });
  (data.flights || []).forEach(f => { if (f.dateISO) dates.push(f.dateISO); });
  dates.sort();
  const iso = dates[0] || new Date().toISOString().slice(0, 10);
  const [y, m] = iso.split('-').map(Number);
  return {y, m: m - 1};
}

function tabSwitch(tab) {
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('section.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
}
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => tabSwitch(b.dataset.tab)));

function shiftMonth(delta) {
  calMonth.m += delta;
  if (calMonth.m < 0) { calMonth.m = 11; calMonth.y--; }
  if (calMonth.m > 11) { calMonth.m = 0; calMonth.y++; }
  renderCalendar();
}

const TRANSPORT_EMOJI = {auto: '🚗', autobus: '🚌', barco: '⛴️', tren: '🚆', taxi: '🚕', apie: '🚶', otro: '📍'};
function transportEmoji(mode) { return TRANSPORT_EMOJI[mode] || '📍'; }

function parseTimeToMinutes(str) {
  if (!str) return null;
  const m = str.trim().toLowerCase().match(/(\d{1,2}):(\d{2})\s*(am|pm)?/);
  if (!m) return null;
  let h = parseInt(m[1]), min = parseInt(m[2]);
  const period = m[3];
  if (period === 'pm' && h !== 12) h += 12;
  if (period === 'am' && h === 12) h = 0;
  return h * 60 + min;
}
function minutesToTime(mins) {
  mins = ((mins % 1440) + 1440) % 1440;
  let h = Math.floor(mins / 60), min = mins % 60;
  const period = h >= 12 ? 'pm' : 'am';
  h = h % 12; if (h === 0) h = 12;
  return h + ':' + String(min).padStart(2, '0') + ' ' + period;
}
function checkinTime(depart) {
  const mins = parseTimeToMinutes(depart);
  if (mins === null) return null;
  return minutesToTime(mins - 120);
}

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}
function cityColor(name) {
  if (!data.cityColors) data.cityColors = {};
  if (!data.cityColors[name]) {
    const hue = Math.floor(Math.random() * 360);
    data.cityColors[name] = hslToHex(hue, 42, 36);
    saveData();
  }
  return data.cityColors[name];
}

function formatMonthLabel(y, m) {
  return new Date(y, m, 1).toLocaleDateString('en-US', {month: 'long', year: 'numeric'});
}
function formatDateEs(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US', {weekday: 'long', day: 'numeric', month: 'long'});
}

function mapSearch(id) {
  const input = document.getElementById(id);
  if (!input || !input.value.trim()) return;
  window.open('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(input.value.trim()), '_blank');
}

function staysOnDay(iso) {
  return (data.stays || []).filter(s => s.checkinDate && s.checkoutDate && s.checkinDate <= iso && s.checkoutDate >= iso);
}

function renderAll() {
  renderCalendar();
  renderFlights();
  renderTransport();
  renderStays();
  renderIdeas();
}

function renderCalendar() {
  document.getElementById('header-subtitle').textContent = formatMonthLabel(calMonth.y, calMonth.m);
  document.getElementById('cal-month-label').textContent = formatMonthLabel(calMonth.y, calMonth.m);
  const dow = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  document.getElementById('cal-dow-row').innerHTML = dow.map(d => `<div class="cal-dow">${d}</div>`).join('');

  const first = new Date(calMonth.y, calMonth.m, 1);
  let startOffset = first.getDay() - 1;
  if (startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(calMonth.y, calMonth.m + 1, 0).getDate();
  const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

  const todayISO = new Date().toISOString().slice(0, 10);
  let html = '';
  for (let i = 0; i < totalCells; i++) {
    const dayNum = i - startOffset + 1;
    let cellDate, faded = false;
    if (dayNum < 1) {
      const prevMonthDays = new Date(calMonth.y, calMonth.m, 0).getDate();
      cellDate = new Date(calMonth.y, calMonth.m - 1, prevMonthDays + dayNum);
      faded = true;
    } else if (dayNum > daysInMonth) {
      cellDate = new Date(calMonth.y, calMonth.m + 1, dayNum - daysInMonth);
      faded = true;
    } else {
      cellDate = new Date(calMonth.y, calMonth.m, dayNum);
    }
    const iso = cellDate.getFullYear() + '-' + String(cellDate.getMonth() + 1).padStart(2, '0') + '-' + String(cellDate.getDate()).padStart(2, '0');
    const isToday = iso === todayISO;
    let inner = `<div class="cal-daynum">${cellDate.getDate()}</div>`;

    staysOnDay(iso).forEach(s => {
      if (s.pending) {
        inner += `<div class="cal-chip pending">${s.city}</div>`;
      } else {
        inner += `<div class="cal-chip" style="background:${cityColor(s.city)};">${s.city}</div>`;
      }
    });
    data.flights.filter(f => f.dateISO === iso).forEach(f => {
      inner += `<div class="cal-flight">✈️ ${f.from.split(',')[0]} → ${f.to.split(',')[0]}</div>`;
    });
    data.transports.filter(t => t.dateISO === iso).forEach(t => {
      const label = (t.from || t.to) ? `${t.from || '?'} → ${t.to || '?'}` : (t.desc || '');
      inner += `<div class="cal-transport">${transportEmoji(t.mode)} ${label}</div>`;
    });

    html += `<div class="cal-cell ${faded ? 'faded' : ''} ${isToday ? 'today' : ''} ${iso === currentDayIso ? 'selected' : ''}" onclick="openDay('${iso}')">${inner}</div>`;
  }
  document.getElementById('cal-grid').innerHTML = html;

  const uniqueCities = [...new Set(data.stays.map(s => s.city))];
  document.getElementById('cal-legend').innerHTML = uniqueCities.map(name => {
    const isPending = data.stays.some(s => s.city === name && s.pending);
    const color = isPending ? 'var(--gold)' : cityColor(name);
    return `<span><span class="dot" style="background:${color};"></span>${name}</span>`;
  }).join('') + `<span>✈️ flight</span>` + [...new Set(data.transports.map(t => t.mode))].map(m => `<span>${transportEmoji(m)} ${m}</span>`).join('');
  renderDayView();
}

function openDay(iso) {
  currentDayIso = (currentDayIso === iso) ? null : iso;
  renderCalendar();
}
function closeDayView() {
  currentDayIso = null;
  renderCalendar();
}
function renderDayView() {
  const el = document.getElementById('day-view');
  if (!currentDayIso) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'block';
  const iso = currentDayIso;
  const stays = staysOnDay(iso);
  const cityNames = [...new Set(stays.map(s => s.city))];

  let items = [];
  data.flights.filter(f => f.dateISO === iso).forEach(f => {
    items.push({ mins: parseTimeToMinutes(f.depart), label: `✈️ ${f.from} → ${f.to}`, sub: `Departs ${f.depart} · Arrives ${f.arrive}` });
    const checkin = checkinTime(f.depart);
    if (checkin) items.push({ mins: parseTimeToMinutes(checkin), label: `🕑 Check-in`, sub: `Flight ${f.from.split(',')[0]} → ${f.to.split(',')[0]}` });
  });
  data.transports.filter(t => t.dateISO === iso).forEach(t => {
    const route = (t.from || t.to) ? `${t.from || '?'} → ${t.to || '?'}` : (t.desc || 'Transport');
    const timeStr = [t.depart ? 'Departs ' + t.depart : '', t.arrive ? 'Arrives ' + t.arrive : '', t.duration ? '⏱ ' + t.duration : ''].filter(Boolean).join(' · ');
    items.push({ mins: parseTimeToMinutes(t.depart), label: `${transportEmoji(t.mode)} ${route}`, sub: [timeStr, (t.desc && (t.from || t.to)) ? t.desc : ''].filter(Boolean).join(' · ') });
  });
  stays.forEach(s => {
    if (s.checkinDate === iso) items.push({ mins: parseTimeToMinutes(s.checkinTime), label: `🛏️ Check-in · ${s.city}${s.place ? ' — ' + s.place : ''}`, sub: s.checkinTime || '' });
    if (s.checkoutDate === iso) items.push({ mins: parseTimeToMinutes(s.checkoutTime), label: `🚪 Check-out · ${s.city}${s.place ? ' — ' + s.place : ''}`, sub: s.checkoutTime || '' });
  });
  cityNames.forEach(name => {
    data.ideas.filter(i => i.city === name).forEach(p => {
      items.push({ mins: parseTimeToMinutes(p.time), label: `📍 ${p.text}`, sub: p.time || '' });
    });
  });

  const timed = items.filter(x => x.mins !== null).sort((a, b) => a.mins - b.mins);
  const untimed = items.filter(x => x.mins === null);

  el.innerHTML = `
    <div class="day-view-head">
      <h3>${formatDateEs(iso)}${cityNames.length ? ' · ' + cityNames.join(' → ') : ''}</h3>
      <button class="ghost" onclick="closeDayView()">Close</button>
    </div>
    ${(timed.length || untimed.length) ? '' : '<p class="empty">Nothing scheduled for this day.</p>'}
    ${timed.map(x => `<div class="day-item"><span class="day-time">${minutesToTime(x.mins)}</span><div><p class="day-label">${x.label}</p><p class="day-sub">${x.sub}</p></div></div>`).join('')}
    ${untimed.length ? `<p class="day-untimed-label">No time set</p>` + untimed.map(x => `<div class="day-item"><span class="day-time">— —</span><div><p class="day-label">${x.label}</p><p class="day-sub">${x.sub}</p></div></div>`).join('') : ''}
  `;
}

function pad2(n) { return String(n).padStart(2, '0'); }
function icsDate(dateISO) { return dateISO.replace(/-/g, ''); }
function icsDateTime(dateISO, timeStr) {
  const mins = parseTimeToMinutes(timeStr);
  if (mins === null) return null;
  const [y, m, d] = dateISO.split('-').map(Number);
  const h = Math.floor(mins / 60), mi = mins % 60;
  return `${y}${pad2(m)}${pad2(d)}T${pad2(h)}${pad2(mi)}00`;
}
function escapeICS(s) { return String(s || '').replace(/([,;])/g, '\\$1').replace(/\n/g, '\\n'); }

function generateICS() {
  let lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//McBoris World Tour//EN'];
  data.stays.forEach(s => {
    if (!s.checkinDate || !s.checkoutDate) return;
    const dtStart = icsDateTime(s.checkinDate, s.checkinTime);
    const dtEnd = icsDateTime(s.checkoutDate, s.checkoutTime);
    lines.push('BEGIN:VEVENT', 'UID:' + uid() + '@mcborisworldtour');
    lines.push(dtStart ? 'DTSTART:' + dtStart : 'DTSTART;VALUE=DATE:' + icsDate(s.checkinDate));
    lines.push(dtEnd ? 'DTEND:' + dtEnd : 'DTEND;VALUE=DATE:' + icsDate(s.checkoutDate));
    lines.push('SUMMARY:' + escapeICS(s.city + (s.place ? ' - ' + s.place : '') + (s.pending ? ' (TBD)' : '')));
    lines.push('END:VEVENT');
  });
  data.flights.forEach(f => {
    if (!f.dateISO) return;
    const dtStart = icsDateTime(f.dateISO, f.depart);
    const dtEnd = icsDateTime(f.dateISO, f.arrive);
    lines.push('BEGIN:VEVENT', 'UID:' + uid() + '@mcborisworldtour');
    lines.push(dtStart ? 'DTSTART:' + dtStart : 'DTSTART;VALUE=DATE:' + icsDate(f.dateISO));
    if (dtEnd) lines.push('DTEND:' + dtEnd);
    lines.push('SUMMARY:' + escapeICS('Flight ' + f.from + ' -> ' + f.to));
    lines.push('DESCRIPTION:' + escapeICS((f.airline || '') + ' Departs ' + f.depart + ' Arrives ' + f.arrive));
    lines.push('END:VEVENT');
  });
  data.transports.forEach(t => {
    if (!t.dateISO) return;
    const route = (t.from || t.to) ? `${t.from || '?'} -> ${t.to || '?'}` : (t.desc || 'Transport');
    const dtStart = icsDateTime(t.dateISO, t.depart);
    lines.push('BEGIN:VEVENT', 'UID:' + uid() + '@mcborisworldtour');
    lines.push(dtStart ? 'DTSTART:' + dtStart : 'DTSTART;VALUE=DATE:' + icsDate(t.dateISO));
    const dtEnd = icsDateTime(t.dateISO, t.arrive);
    if (dtEnd) lines.push('DTEND:' + dtEnd);
    lines.push('SUMMARY:' + escapeICS(route));
    lines.push('DESCRIPTION:' + escapeICS([t.duration, t.desc].filter(Boolean).join(' - ')));
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function exportICS() {
  const blob = new Blob([generateICS()], { type: 'text/calendar' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'mcboris-world-tour.ics';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  s.city = document.getElementById('edit-stay-city-' + id).value.trim() || s.city;
  s.checkinDate = document.getElementById('edit-stay-checkin-date-' + id).value;
  s.checkinTime = document.getElementById('edit-stay-checkin-time-' + id).value.trim();
  s.checkoutDate = document.getElementById('edit-stay-checkout-date-' + id).value;
  s.checkoutTime = document.getElementById('edit-stay-checkout-time-' + id).value.trim();
  s.pending = document.getElementById('edit-stay-pending-' + id).checked;
  editingIds.delete(id);
  saveData(); renderAll();
}

function addIdea() {
  const city = document.getElementById('new-idea-city').value.trim();
  const time = document.getElementById('new-idea-time').value.trim();
  const text = document.getElementById('new-idea-text').value.trim();
  if (!text) return;
  data.ideas.push({id: uid(), city, time, text});
  document.getElementById('new-idea-time').value = '';
  document.getElementById('new-idea-text').value = '';
  saveData(); renderAll();
}
function removeIdea(id) { data.ideas = data.ideas.filter(i => i.id !== id); saveData(); renderAll(); }
function saveIdea(id) {
  const i = data.ideas.find(x => x.id === id);
  if (!i) return;
  i.city = document.getElementById('edit-idea-city-' + id).value.trim();
  i.time = document.getElementById('edit-idea-time-' + id).value.trim();
  i.text = document.getElementById('edit-idea-text-' + id).value.trim() || i.text;
  editingIds.delete(id);
  saveData(); renderAll();
}

loadData();
</script>
